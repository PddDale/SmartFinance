{% extends "base.html" %}

{% block title %}SmartFinance &bull; Escolher banco{% endblock %}

{% block content %}
<div class="pt-4">
    <div class="card card-clean p-4 mx-auto" style="max-width: 720px;">
        <h1 class="h4 fw-bold">Encontramos um banco nesta pasta</h1>
        <p class="text-muted">
            A pasta escolhida já possui dados. Escolha qual banco deseja manter:
        </p>
        <div class="small text-muted bg-light rounded p-3 mb-4 text-break">{{ database_path }}</div>
        <div class="d-flex flex-wrap gap-2">
            <form method="POST" action="{{ url_for('usar_banco_selecionado') }}">
                <input type="hidden" name="database_path" value="{{ database_path }}">
                <button class="btn-action btn-primary-action" type="submit">
                    Usar o banco escolhido
                </button>
            </form>
            <a class="btn-action btn-neutral-action text-decoration-none" href="{{ url_for('configuracoes') }}">
                Manter o banco atual
            </a>
        </div>
    </div>
</div>
{% endblock %}
